<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Themes - Hatta Games TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #1a2942; 
            --bg-bottom: #0b111c;
            --text-main: #f0f6fc;
            --text-muted: #8b9db5; 
            --blue-light: #58a6ff;
            --blue-dark: #0056b3;
            --border-color: rgba(255,255,255,0.05);
            --bg-card: rgba(20, 26, 41, 0.7);
            --glow-preview: rgba(88, 166, 255, 0.5);
            --glow-download: rgba(0, 86, 179, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at top center, var(--bg-top) 0%, var(--bg-bottom) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* EFEK TRANSISI HALUS SAAT HALAMAN DI-LOAD */
            animation: fadeInPage 0.8s ease-in-out;
        }

        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 10px 20px;
            position: relative;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            position: relative;
            cursor: pointer;
            text-decoration: none; /* Menghapus garis bawah link */
        }

        .main-logo { 
            width: 100%; 
            max-width: 450px; 
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); 
            transition: transform 0.3s ease;
        }

        .logo-container:hover .main-logo {
            transform: scale(1.02); /* Efek sedikit membesar saat logo dihover */
        }

        .subtitle {
            margin-top: -12px;
            margin-right: 18px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        
        .by-text { color: #7a8c9e; font-weight: 400; }
        .hatta-text { color: #4a88c7; font-weight: 500; }

        .social-container {
            position: absolute;
            right: 40px;
            top: 40px;
            display: flex;
            gap: 15px;
        }

        .social-icon {
            width: 32px;
            height: 32px;
            transition: transform 0.3s ease;
        }
        .social-icon:hover { transform: scale(1.1); }

        .toolbar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 30px auto 40px auto;
            width: 100%;
            padding: 0 20px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 14px 25px;
            border-radius: 30px;
            background-color: #172236;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d1d9e6;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--blue-light);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
        }

        main {
            padding: 0 40px 40px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border-color: rgba(88, 166, 255, 0.3);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .tag {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        .card-title {
            margin: 15px 0;
            font-size: 15px;
            font-weight: 400;
            color: var(--text-main);
            text-align: center;
        }

        .btn-group { display: flex; gap: 10px; }

        .btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 20px;
            border: none;
            font-family: inherit;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* EFEK GLOW PADA TOMBOL PREVIEW */
        .btn-preview {
            background: rgba(88, 166, 255, 0.1);
            color: var(--blue-light);
            border: 1px solid rgba(88, 166, 255, 0.3);
        }
        .btn-preview:hover {
            background: var(--blue-light);
            color: #000;
            box-shadow: 0 0 15px var(--glow-preview);
        }

        /* EFEK GLOW PADA TOMBOL DOWNLOAD */
        .btn-download {
            background: var(--blue-dark);
            color: white;
        }
        .btn-download:hover {
            background: #007bff;
            box-shadow: 0 0 20px var(--glow-download);
            transform: scale(1.02);
        }

        .pagination { display: flex; justify-content: center; gap: 8px; margin: 40px 0 60px 0; }

        .page-btn {
            background: rgba(20, 26, 41, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            width: 38px; height: 38px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn.active { 
            background: var(--blue-light); 
            color: white; 
            box-shadow: 0 0 10px var(--glow-preview);
        }

        footer { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 0; border-top: 1px solid var(--border-color); }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-container">
        <img src="recursos/titulo.png" alt="PS4 Themes" class="main-logo">
        <div class="subtitle">
            <span class="by-text">by</span> <span class="hatta-text">Hatta Games TV</span>
        </div>
    </a>
   <div class="social-container">
        <a href="https://www.youtube.com/@hattagamesplus" target="_blank"><img src="recursos/yt.png" alt="YT" class="social-icon"></a>
        <a href="https://github.com/hattagames" target="_blank"><img src="recursos/git.png" alt="Git" class="social-icon"></a>
        <a href="https://paypal.me/hattapahlevii" target="_blank"><img src="recursos/x.png" alt="X" class="social-icon"></a>
    </div>
</header>

<div class="toolbar">
    <input type="text" id="search" class="search-box" placeholder="Search themes...">
</div>

<main id="gallery"></main>
<div class="pagination" id="pagination"></div>

<footer>
    Powered by Hatta Games TV
</footer>

<script>
    let allThemes = [];
    let filteredThemes = [];
    let currentPage = 1;
    const itemsPerPage = 12;

    async function init() {
        const response = await fetch('./temas.json');
        allThemes = await response.json();
        filteredThemes = [...allThemes];
        render();
    }

    function render() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';
        const start = (currentPage - 1) * itemsPerPage;
        const items = filteredThemes.slice(start, start + itemsPerPage);

        items.forEach(tema => {
            const card = document.createElement('div');
            card.className = 'card';
            const isDynamic = tema.nombre.toLowerCase().includes('dynamic');
            card.innerHTML = `
                <div class="img-wrapper">
                    <img src="./Images/640/${encodeURIComponent(tema.nombre)}.webp" loading="lazy">
                    <div class="tag">${isDynamic ? 'Dynamic' : 'Static'}</div>
                </div>
                <h3 class="card-title">${tema.nombre}</h3>
                <div class="btn-group">
                    <button class="btn btn-preview" onclick="window.open('./Images/${encodeURIComponent(tema.nombre)}.webp', '_blank')">Preview</button>
                    <button class="btn btn-download" onclick="window.open('${tema.descarga}', '_blank')">Download</button>
                </div>
            `;
            gallery.appendChild(card);
        });
        renderPagination();
    }

    function renderPagination() {
        const container = document.getElementById('pagination');
        container.innerHTML = '';
        const pages = Math.ceil(filteredThemes.length / itemsPerPage);
        for (let i = 1; i <= pages; i++) {
            const btn = document.createElement('button');
            btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            btn.textContent = i;
            btn.onclick = () => { currentPage = i; render(); window.scrollTo({top: 0, behavior: 'smooth'}); };
            container.appendChild(btn);
        }
    }

    document.getElementById('search').addEventListener('input', (e) => {
        const text = e.target.value.toLowerCase();
        filteredThemes = allThemes.filter(t => t.nombre.toLowerCase().includes(text));
        currentPage = 1;
        render();
    });

    init();
</script>
</body>
</html>
