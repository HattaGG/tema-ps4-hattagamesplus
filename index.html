<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 THM KZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #1a2942; 
            --bg-bottom: #0b111c;
            --text-main: #f0f6fc;
            --text-muted: #8b9db5; 
            --blue-light: #58a6ff;
            --blue-dark: #0056b3;
            --border-color: rgba(255,255,255,0.05);
            --bg-card: rgba(20, 26, 41, 0.7);
            --glow-preview: rgba(88, 166, 255, 0.5);
            --glow-download: rgba(0, 86, 179, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at top center, var(--bg-top) 0%, var(--bg-bottom) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .main-logo {
            cursor: pointer;
            font-size: 2rem;
            font-weight: 600;
            color: var(--blue-light);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .controls {
            max-width: 1000px;
            margin: 1.5rem auto;
            width: 90%;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            align-items: center;
        }

        .search-container { position: relative; flex: 1; min-width: 250px; }
        input#search {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05);
            color: #fff;
            outline: none;
        }

        select {
            padding: 0.8rem;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid var(--border-color);
            outline: none;
            cursor: pointer;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 1rem 2rem;
            flex: 1;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover { transform: translateY(-5px); }

        .thumb-container {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info { padding: 1.2rem; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.1rem; font-weight: 500; margin-bottom: 0.5rem; }
        .card-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; }

        .btn-group { display: flex; gap: 0.8rem; margin-top: auto; }
        .btn {
            flex: 1;
            padding: 0.7rem;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-preview { background: rgba(88, 166, 255, 0.1); color: var(--blue-light); border: 1px solid var(--blue-light); }
        .btn-preview:hover { background: var(--blue-light); color: #fff; box-shadow: 0 0 15px var(--glow-preview); }

        .btn-download { background: var(--blue-dark); color: #fff; }
        .btn-download:hover { background: #0069d9; box-shadow: 0 0 15px var(--glow-download); }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 2rem;
        }

        .page-btn {
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            cursor: pointer;
        }

        .page-btn.active { background: var(--blue-light); color: #fff; border-color: var(--blue-light); }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        footer {
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-link { color: var(--blue-light); text-decoration: none; }

        /* Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <header>
        <div class="main-logo">PS4 THM KZ</div>
        <div class="subtitle">Custom Themes for PlayStation 4</div>
    </header>

    <div class="controls">
        <div class="search-container">
            <input type="text" id="search" placeholder="Search themes...">
        </div>
        <select id="category">
            <option value="ALL">All Categories</option>
            <option value="Anime">Anime</option>
            <option value="Games">Games</option>
            <option value="Retro">Retro</option>
            <option value="Minimalist">Minimalist</option>
        </select>
        <select id="sort">
            <option value="AZ">Name (A-Z)</option>
            <option value="ZA">Name (Z-A)</option>
        </select>
    </div>

    <div class="grid" id="theme-grid"></div>

    <div class="pagination" id="pagination"></div>

    <footer>
        &copy; 2026 PS4 THM KZ. Maintained by <a href="https://github.com/HattaGames" class="footer-link" target="_blank">HattaGames</a>
    </footer>

    <div class="modal" id="modal">
        <img class="modal-content" id="modal-img" src="" alt="Preview">
    </div>

    <script>
        const THEMES_JSON = 'https://raw.githubusercontent.com/HattaGames/ps4-themes/main/themes.json'; 

        let allThemes = [];
        let filteredThemes = [];
        let currentPage = 1;
        const itemsPerPage = 12;

        const grid = document.getElementById('theme-grid');
        const paginationContainer = document.getElementById('pagination');
        const searchInput = document.getElementById('search');
        const catSelect = document.getElementById('category');
        const sortSelect = document.getElementById('sort');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');

        let searchText = '';
        let currentCategory = 'ALL';
        let currentSort = 'AZ';

        async function init() {
            try {
                const res = await fetch(THEMES_JSON);
                allThemes = await res.json();
                applyFilters();
            } catch (e) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Error loading themes. Please check the JSON source.</p>';
            }
        }

        function applyFilters() {
            filteredThemes = allThemes.filter(t => {
                const matchSearch = t.nombre.toLowerCase().includes(searchText.toLowerCase());
                const matchCat = currentCategory === 'ALL' || t.categoria === currentCategory;
                return matchSearch && matchCat;
            });

            if (currentSort === 'AZ') filteredThemes.sort((a,b) => a.nombre.localeCompare(b.nombre));
            else filteredThemes.sort((a,b) => b.nombre.localeCompare(a.nombre));

            currentPage = 1;
            render();
        }

        searchInput.addEventListener('input', (e) => { searchText = e.target.value; applyFilters(); });
        catSelect.addEventListener('change', (e) => { currentCategory = e.target.value; applyFilters(); });
        sortSelect.addEventListener('change', (e) => { currentSort = e.target.value; applyFilters(); });

        function render() {
            grid.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginated = filteredThemes.slice(start, end);

            if (paginated.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No themes found.</p>';
                paginationContainer.innerHTML = '';
                return;
            }

            paginated.forEach(theme => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="thumb-container">
                        <img src="${theme.preview}" alt="${theme.nombre}" loading="lazy">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${theme.nombre}</div>
                        <div class="card-meta">${theme.categoria} • ${theme.size || 'N/A'}</div>
                        <div class="btn-group">
                            <button class="btn btn-preview" onclick="showPreview('${theme.preview}')">Preview</button>
                            <a href="${theme.download}" class="btn btn-download" target="_blank">Download</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination();
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(filteredThemes.length / itemsPerPage);
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerHTML = '&lt;';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { currentPage--; render(); window.scrollTo({top: 0, behavior: 'smooth'}); };
            paginationContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => { currentPage = i; render(); window.scrollTo({top: 0, behavior: 'smooth'}); };
                paginationContainer.appendChild(btn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerHTML = '&gt;';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { currentPage++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); };
            paginationContainer.appendChild(nextBtn);
        }

        function showPreview(url) { modalImg.src = url; modal.classList.add('show'); }
        function closePreview() { modal.classList.remove('show'); setTimeout(() => { modalImg.src = ''; }, 300); }
        modal.addEventListener('click', (e) => { if (e.target === modal) closePreview(); });

        init();

        function resetToMain() {
            if (!allThemes.length) return;
            searchText = '';
            searchInput.value = '';
            currentCategory = 'ALL';
            catSelect.value = 'ALL';
            currentSort = 'AZ';
            sortSelect.value = 'AZ';
            filteredThemes = [...allThemes].sort((a, b) => a.nombre.localeCompare(b.nombre));
            currentPage = 1;
            render();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const logo = document.querySelector('.main-logo');
            if (logo) {
                logo.addEventListener('click', resetToMain);
            }
        });
    </script>
</body>
</html>
