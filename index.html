<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Themes - Hatta Games TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #1a2942; 
            --bg-bottom: #0b111c;
            --text-main: #f0f6fc;
            --text-muted: #8b9db5; 
            --blue-light: #58a6ff;
            --blue-dark: #0056b3;
            --border-color: rgba(255,255,255,0.05);
            --bg-card: rgba(20, 26, 41, 0.7);
            --glow-preview: rgba(88, 166, 255, 0.5);
            --glow-download: rgba(0, 86, 179, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at top center, var(--bg-top) 0%, var(--bg-bottom) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 10px 20px;
            position: relative;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            cursor: pointer; /* Menandakan logo bisa diklik */
        }

        .main-logo { 
            width: 100%; 
            max-width: 450px; 
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); 
        }

        .subtitle {
            margin-top: -12px;
            margin-right: 18px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        
        .by-text { color: #7a8c9e; font-weight: 400; }
        .hatta-text { color: #4a88c7; font-weight: 500; }

        .social-container {
            position: absolute;
            right: 40px;
            top: 40px;
            display: flex;
            gap: 15px;
        }

        .social-icon {
            width: 32px;
            height: 32px;
            transition: transform 0.3s ease;
        }
        .social-icon:hover { transform: scale(1.1); }

        .toolbar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 30px auto 40px auto;
            width: 100%;
            padding: 0 20px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
        }

        .search-box {
            width: 100%;
            padding: 14px 45px 14px 25px;
            border-radius: 30px;
            background-color: #172236;
            border: 1px solid transparent;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3);
            color: #d1d9e6;
            outline: none;
        }

        .filters-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .custom-select {
            background: rgba(20, 29, 46, 0.6);
            color: #8b9db5;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .random-button { background: transparent; border: none; cursor: pointer; }
        .dado-icon { width: 32px; height: 32px; }

        main {
            padding: 0 40px 40px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* EFEK GLOW DI CARD (Dikembalikan) */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            transition: all 0.3s ease;
            position: relative;
        }

        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.3); /* Glow biru saat hover */
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .tags { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 5px; }
        .tag { background: rgba(0, 0, 0, 0.7); color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; }

        .card-title { margin: 15px 0; font-size: 15px; font-weight: 400; text-align: center; }

        .btn-group { display: flex; gap: 10px; }

        /* EFEK GLOW DI TOMBOL (Dikembalikan) */
        .btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 20px;
            border: none;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-preview {
            background: rgba(88, 166, 255, 0.1);
            color: var(--blue-light);
            border: 1px solid var(--blue-light);
        }
        .btn-preview:hover { box-shadow: 0 0 15px var(--glow-preview); }

        .btn-download {
            background: var(--blue-dark);
            color: white;
        }
        .btn-download:hover { box-shadow: 0 0 15px var(--glow-download); }

        .pagination { display: flex; justify-content: center; gap: 8px; margin: 40px 0 60px 0; }
        .page-btn {
            background: rgba(20, 26, 41, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            width: 38px; height: 38px;
            border-radius: 8px;
            cursor: pointer;
        }
        .page-btn.active { background: var(--blue-light); color: white; border-color: var(--blue-light); }

        footer { text-align: center; color: var(--text-muted); font-size: 13px; padding-bottom: 30px; }
        
        #preview-modal {
            visibility: hidden; opacity: 0;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            transition: 0.3s;
        }
        #preview-modal.show { visibility: visible; opacity: 1; }
        #preview-modal img { max-width: 90%; max-height: 85%; border-radius: 12px; }
    </style>
</head>
<body>

<header>
    <div class="logo-container" onclick="resetToMain()">
        <img src="recursos/titulo.png" alt="PS4 Themes" class="main-logo">
        <div class="subtitle">
            <span class="by-text">by</span> <span class="hatta-text">Hatta Games TV</span>
        </div>
    </div>
    <div class="social-container">
        <a href="https://www.youtube.com/@hattagamesplus" target="_blank"><img src="recursos/yt.png" alt="YT" class="social-icon"></a>
        <a href="https://github.com/hattagamesplus" target="_blank"><img src="recursos/git.png" alt="Git" class="social-icon"></a>
        <a href="https://paypal.me/hattapahlevii" target="_blank"><img src="recursos/x.png" alt="X" class="social-icon"></a>
    </div>
</header>

<div class="toolbar">
    <div class="search-wrapper">
        <input type="text" id="search" class="search-box" placeholder="Search themes...">
    </div>
    <div class="filters-container">
        <select class="custom-select" id="sort-select">
            <option value="AZ">A-Z</option>
            <option value="ZA">Z-A</option>
        </select>
        <select class="custom-select" id="cat-select">
            <option value="ALL">All Categories</option>
            <option value="DYN">Dynamic</option>
            <option value="STA">Static</option>
        </select>
        <button id="random-btn" class="random-button">
            <img src="recursos/dado.png" alt="Random" class="dado-icon">
        </button>
    </div>
</div>

<main id="gallery"></main>
<div id="no-results" style="display:none; text-align:center; padding: 50px;">
    <h2 style="color: var(--text-muted);">No themes found</h2>
</div>
<div class="pagination" id="pagination"></div>

<footer>
    Powered by Hatta Games TV
</footer>

<div id="preview-modal" onclick="closePreview()">
    <img id="modal-img" src="">
</div>

<script>
    let allThemes = [];
    let filteredThemes = [];
    let currentPage = 1;
    const itemsPerPage = 12;
    let searchText = '';
    let currentCategory = 'ALL';
    let currentSort = 'AZ';

    const gallery = document.getElementById('gallery');
    const searchInput = document.getElementById('search');
    const paginationContainer = document.getElementById('pagination');

    async function init() {
        try {
            const response = await fetch('./temas.json');
            allThemes = await response.json();
            applyFilters();
        } catch (err) { console.error("Error:", err); }
    }

    function applyFilters() {
        let temp = allThemes.filter(theme => {
            const isDyn = theme.nombre.toLowerCase().includes('dynamic');
            const matchesCat = (currentCategory === 'ALL') || 
                               (currentCategory === 'DYN' && isDyn) || 
                               (currentCategory === 'STA' && !isDyn);
            const matchesSearch = theme.nombre.toLowerCase().includes(searchText);
            return matchesSearch && matchesCat;
        });

        if (currentSort === 'AZ') temp.sort((a, b) => a.nombre.localeCompare(b.nombre));
        else if (currentSort === 'ZA') temp.sort((a, b) => b.nombre.localeCompare(a.nombre));

        filteredThemes = temp;
        currentPage = 1;
        render();
    }

    function render() {
        gallery.innerHTML = '';
        if (filteredThemes.length === 0) { document.getElementById('no-results').style.display = 'block'; return; }
        document.getElementById('no-results').style.display = 'none';

        const start = (currentPage - 1) * itemsPerPage;
        const items = filteredThemes.slice(start, start + itemsPerPage);

        items.forEach(tema => {
            const card = document.createElement('div');
            card.className = 'card';
            const imgPath = `./Images/640/${encodeURIComponent(tema.nombre)}.webp`;
            const tag = tema.nombre.toLowerCase().includes('dynamic') ? 'Dynamic' : 'Static';
            
            card.innerHTML = `
                <div class="img-wrapper">
                    <img src="${imgPath}" loading="lazy" onerror="this.src='https://placehold.co/600x337/161b22/8b949e?text=No+Image'">
                    <div class="tags"><span class="tag">[${tag}]</span></div>
                </div>
                <h3 class="card-title">${tema.nombre}</h3>
                <div class="btn-group">
                    <button class="btn btn-preview" onclick="showPreview('./Images/${encodeURIComponent(tema.nombre)}.webp')">Preview</button>
                    <button class="btn btn-download" onclick="window.open('${tema.descarga}', '_blank')">Download</button>
                </div>
            `;
            gallery.appendChild(card);
        });
        renderPagination();
    }

    // FUNGSI NAVIGASI HALAMAN (Maksimal 5 tombol halaman)
    function renderPagination() {
        paginationContainer.innerHTML = '';
        const totalPages = Math.ceil(filteredThemes.length / itemsPerPage);
        if (totalPages <= 1) return;

        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);
        
        if (endPage - startPage < 4) {
            startPage = Math.max(1, endPage - 4);
        }

        for (let i = startPage; i <= endPage; i++) {
            const btn = document.createElement('button');
            btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            btn.textContent = i;
            btn.onclick = () => { currentPage = i; render(); window.scrollTo(0,0); };
            paginationContainer.appendChild(btn);
        }
    }

    // Fungsi reset saat logo diklik
    function resetToMain() {
        searchText = '';
        searchInput.value = '';
        currentCategory = 'ALL';
        document.getElementById('cat-select').value = 'ALL';
        applyFilters();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    searchInput.addEventListener('input', (e) => { searchText = e.target.value.toLowerCase(); applyFilters(); });
    document.getElementById('cat-select').addEventListener('change', (e) => { currentCategory = e.target.value; applyFilters(); });
    document.getElementById('sort-select').addEventListener('change', (e) => { currentSort = e.target.value; applyFilters(); });
    document.getElementById('random-btn').addEventListener('click', () => { 
        filteredThemes.sort(() => Math.random() - 0.5); 
        render(); 
    });

    function showPreview(url) { document.getElementById('modal-img').src = url; document.getElementById('preview-modal').classList.add('show'); }
    function closePreview() { document.getElementById('preview-modal').classList.remove('show'); }
    
    init();
</script>
</body>
</html>
