<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HattaGamesPlus PS4 Themes</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{
background:#0b111c;
color:#fff;
font-family:Poppins;
margin:0;
}

/* SIMPLE CLEAN VERSION */

header{
text-align:center;
padding:30px;
}

h1{
font-weight:500;
}

.subtitle{
color:#8b9db5;
}

main{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111827;
padding:10px;
border-radius:10px;
}

.card img{
width:100%;
border-radius:8px;
}

.btn{
display:block;
margin-top:10px;
padding:10px;
text-align:center;
border-radius:8px;
text-decoration:none;
}

.preview{background:#1f2937;}
.download{background:#2563eb;color:white;}

</style>
</head>

<body>

<header>
<h1>HattaGamesPlus PS4 Themes</h1>
<p class="subtitle">Free PS4 Theme Collection</p>
</header>

<main id="gallery"></main>

<script>

async function loadThemes(){
const res = await fetch('./temas.json');
const data = await res.json();

const gallery = document.getElementById('gallery');

data.forEach(t => {

const img = "./Images/640/"+encodeURIComponent(t.nombre)+".webp";

gallery.innerHTML += `
<div class="card">
<img src="${img}">
<h3>${t.nombre}</h3>

<a class="btn preview" href="./Images/${encodeURIComponent(t.nombre)}.webp" target="_blank">
Preview
</a>

<a class="btn download" href="${t.descarga}" target="_blank">
Download
</a>

</div>
`;
});

}

loadThemes();

</script>

</body>
</html>
